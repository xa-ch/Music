<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XA~MUSIC</title>
    <link rel="icon" href="./yes.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4A90E2;
            --secondary: #E29C4A;
            --accent: #E24A68;
            --bg: #f5f6f8;
        }

        body {
            font-family: system-ui,sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem 0.8rem;
            transition: 0.3s ease;
        }

        .geometric-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.06;
        }

        .shape{position:absolute;}
        .triangle{width:0;height:0;border-left:35px solid transparent;border-right:35px solid transparent;border-bottom:60px solid var(--primary);}
        .square{width:45px;height:45px;background:var(--secondary);}
        .circle{width:50px;height:50px;border-radius:50%;background:var(--accent);}

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-shape {
            width: 32px;
            height: 32px;
            background: var(--primary);
            transform: rotate(45deg);
            box-shadow: 2px 2px 0 var(--secondary);
        }
        .logo-shape:nth-child(2){width:26px;height:26px;background:var(--accent);border-radius:50%;transform:rotate(0);}
        .logo-shape:nth-child(3){width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid var(--secondary);}

        .search-box {
            display: flex;
            border: 2px solid var(--primary);
            box-shadow: 4px 4px 0 var(--secondary);
        }

        .search-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: none;
            outline: none;
            font-size: 0.95rem;
            background: transparent;
        }

        .search-btn {
            width: 44px;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .search-btn:hover{background:var(--accent);}

        .search-icon {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: relative;
        }
        .search-icon::after{content:'';position:absolute;width:8px;height:2px;background:#fff;bottom:-5px;right:-5px;transform:rotate(45deg);}

        .player-wrap {
            background: #fff;
            border: 2px solid var(--primary);
            box-shadow: 4px 4px 0 var(--secondary);
            overflow: hidden;
        }

        .status {
            text-align: center;
            font-size: 0.8rem;
            color: #999;
        }

        /* 新增：播放链接展示区域 */
        .music-link-box {
            background: #fff;
            border: 2px solid var(--primary);
            box-shadow: 4px 4px 0 var(--secondary);
            padding: 0.8rem;
            margin-top: 0.5rem;
        }

        .music-link-title {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .music-link-title::before {
            content: "🔗";
            font-size: 0.8rem;
        }

        .music-link-content {
            font-size: 0.7rem;
            word-break: break-all;
            background: #f0f0f0;
            padding: 0.6rem;
            border-radius: 4px;
            font-family: monospace;
            max-height: 80px;
            overflow-y: auto;
        }

        .music-link-content a {
            color: var(--primary);
            text-decoration: none;
        }

        .music-link-content a:hover {
            text-decoration: underline;
        }

        .no-link {
            color: #999;
            font-style: italic;
        }

        .copy-btn {
            margin-top: 0.5rem;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 3px;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent);
        }

        ::-webkit-scrollbar{width:3px;}
        ::-webkit-scrollbar-thumb{background:var(--primary);}
    </style>
</head>
<body>
    <div class="geometric-bg" id="bg"></div>

    <div class="container">
        <div class="logo">
            <div class="logo-shape"></div>
            <div class="logo-shape"></div>
            <div class="logo-shape"></div>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="网易云搜索">
            <button class="search-btn" id="searchBtn">
                <div class="search-icon"></div>
            </button>
        </div>

        <div class="player-wrap">
            <meting-js
                id="反乌托邦"
                server="netease"
                type="search"
                theme="var(--primary)"
                autoplay="false"
                mutex="true"
                list-folded="true"
                list-max-height="180px"
            ></meting-js>
        </div>

        <div class="status" id="status">就绪</div>

        <!-- 新增：显示当前播放链接 -->
        <div class="music-link-box" id="musicLinkBox" style="display: none;">
            <div class="music-link-title">当前播放链接</div>
            <div class="music-link-content" id="musicLinkContent">
                <span class="no-link">未播放</span>
            </div>
            <button class="copy-btn" id="copyLinkBtn" style="display: none;">复制链接</button>
        </div>
    </div>

    <script>
        const monetColors = [
            {p:'#4A90E2',s:'#E29C4A',a:'#E24A68'},
            {p:'#7B68EE',s:'#DDA0DD',a:'#FF69B4'},
            {p:'#32CD32',s:'#FFD700',a:'#FF4500'},
            {p:'#20B2AA',s:'#FFA07A',a:'#FF6347'},
            {p:'#9370DB',s:'#F0E68C',a:'#EE82EE'},
            {p:'#4682B4',s:'#F4A460',a:'#DC143C'}
        ];

        let currentPlayer = null; // 保存当前播放器实例
        let linkCheckInterval = null; // 定时器，定期检查播放链接

        document.addEventListener('DOMContentLoaded',()=>{
            initTheme();
            initBg();
            bindEvent();
            initPlayerObserver(); // 监听播放器创建
            startLinkMonitoring(); // 开始监控播放链接
        });

        function initTheme(){
            const c = monetColors[Math.floor(Math.random()*monetColors.length)];
            document.documentElement.style.setProperty('--primary',c.p);
            document.documentElement.style.setProperty('--secondary',c.s);
            document.documentElement.style.setProperty('--accent',c.a);
        }

        function initBg(){
            const bg = document.getElementById('bg');
            const arr = ['triangle','square','circle'];
            for(let i=0;i<10;i++){
                let dom = document.createElement('div');
                dom.className = `shape ${arr[Math.floor(Math.random()*3)]}`;
                dom.style.left = Math.random()*100+'%';
                dom.style.top = Math.random()*100+'%';
                dom.style.opacity = Math.random()*0.4+0.15;
                bg.appendChild(dom);
            }
        }

        function bindEvent(){
            document.getElementById('searchBtn').onclick = searchMusic;
            document.getElementById('searchInput').addEventListener('keypress',e=>e.key==='Enter'&&searchMusic());
            document.getElementById('copyLinkBtn').onclick = copyLinkToClipboard;
        }

        function searchMusic(){
            let key = document.getElementById('searchInput').value.trim();
            if(!key) return statusTxt('请输入关键词');
            statusTxt('搜索中...');

            let old = document.querySelector('meting-js');
            if(old) old.remove();

            let mt = document.createElement('meting-js');
            mt.setAttribute('server','netease');
            mt.setAttribute('type','search');
            mt.setAttribute('id',key);
            mt.setAttribute('theme','var(--primary)');
            mt.setAttribute('autoplay','false');
            mt.setAttribute('mutex','true');
            mt.setAttribute('list-folded','true');
            mt.setAttribute('list-max-height','180px');

            document.querySelector('.player-wrap').appendChild(mt);
            statusTxt('搜索完成');
            
            // 隐藏链接显示区域，等待新播放器加载
            document.getElementById('musicLinkBox').style.display = 'none';
            currentPlayer = null;
        }

        function statusTxt(t){
            document.getElementById('status').innerText = t;
        }

        // 监听播放器创建
        function initPlayerObserver() {
            // 使用 MutationObserver 监听 meting-js 元素的创建
            const observer = new MutationObserver(() => {
                const metingEl = document.querySelector('meting-js');
                if (metingEl && metingEl.aplayer) {
                    if (currentPlayer !== metingEl.aplayer) {
                        currentPlayer = metingEl.aplayer;
                        bindPlayerEvents(currentPlayer);
                        statusTxt('播放器已加载');
                    }
                }
            });
            
            observer.observe(document.querySelector('.player-wrap'), {
                childList: true,
                subtree: true
            });
            
            // 立即检查一次
            const metingEl = document.querySelector('meting-js');
            if (metingEl && metingEl.aplayer) {
                currentPlayer = metingEl.aplayer;
                bindPlayerEvents(currentPlayer);
            }
        }

        // 绑定播放器事件
        function bindPlayerEvents(player) {
            if (!player) return;
            
            // 监听播放、切换歌曲等事件
            player.on('play', () => {
                setTimeout(() => updateLinkDisplay(player), 100);
            });
            
            player.on('switch', () => {
                setTimeout(() => updateLinkDisplay(player), 200);
            });
            
            player.on('listswitch', () => {
                setTimeout(() => updateLinkDisplay(player), 200);
            });
            
            // 初次加载时也尝试获取
            setTimeout(() => updateLinkDisplay(player), 500);
        }

        // 开始定期监控播放链接（备用方案）
        function startLinkMonitoring() {
            if (linkCheckInterval) clearInterval(linkCheckInterval);
            
            linkCheckInterval = setInterval(() => {
                if (currentPlayer) {
                    updateLinkDisplay(currentPlayer);
                }
            }, 2000); // 每2秒检查一次
        }

        // 更新链接显示
        function updateLinkDisplay(player) {
            if (!player || !player.list || !player.list.audios) {
                return;
            }
            
            const currentIndex = player.list.index;
            const currentAudio = player.list.audios[currentIndex];
            
            if (currentAudio && currentAudio.url) {
                const linkBox = document.getElementById('musicLinkBox');
                const linkContent = document.getElementById('musicLinkContent');
                const copyBtn = document.getElementById('copyLinkBtn');
                
                // 显示链接区域
                linkBox.style.display = 'block';
                
                // 构建显示内容
                const songName = currentAudio.title || '未知歌曲';
                const artist = currentAudio.author || '未知歌手';
                const url = currentAudio.url;
                
                linkContent.innerHTML = `
                    <div style="margin-bottom: 6px;">
                        🎵 ${songName} - ${artist}
                    </div>
                    <div>
                        🔗 <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
                    </div>
                `;
                
                copyBtn.style.display = 'block';
                statusTxt(`正在播放：${songName}`);
            } else if (currentAudio && !currentAudio.url) {
                // 有歌曲但还没获取到链接
                const linkContent = document.getElementById('musicLinkContent');
                linkContent.innerHTML = '<span class="no-link">⏳ 正在获取播放链接...</span>';
                document.getElementById('copyLinkBtn').style.display = 'none';
            }
        }

        // 复制链接到剪贴板
        async function copyLinkToClipboard() {
            if (!currentPlayer || !currentPlayer.list || !currentPlayer.list.audios) {
                statusTxt('没有播放链接可复制');
                return;
            }
            
            const currentIndex = currentPlayer.list.index;
            const currentAudio = currentPlayer.list.audios[currentIndex];
            
            if (currentAudio && currentAudio.url) {
                try {
                    await navigator.clipboard.writeText(currentAudio.url);
                    statusTxt('✅ 链接已复制到剪贴板');
                    
                    // 2秒后恢复状态
                    setTimeout(() => {
                        if (currentAudio.title) {
                            statusTxt(`正在播放：${currentAudio.title}`);
                        } else {
                            statusTxt('就绪');
                        }
                    }, 2000);
                } catch (err) {
                    statusTxt('❌ 复制失败，请手动复制');
                    console.error('复制失败:', err);
                }
            } else {
                statusTxt('没有可复制的播放链接');
            }
        }

        // 清理定时器（可选，页面关闭时）
        window.addEventListener('beforeunload', () => {
            if (linkCheckInterval) {
                clearInterval(linkCheckInterval);
            }
        });
    </script>
</body>
</html>
